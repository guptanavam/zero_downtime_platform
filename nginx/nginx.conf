events {
    # Maximum number of simultaneous connections per worker process
    worker_connections 1024;
}

http {
    # 1. UPSTREAM BLOCK: Defines the pool of backend servers.
    # In Blue-Green deployments, this is the master switch!
    upstream app_servers {
        server web-blue:5000;
    }

    # 2. SERVER BLOCK: The public entrypoint
    server {
        # Listen for HTTP traffic on standard port 80
        listen 80;

        # 3. LOCATION BLOCK: Match all incoming URL paths
        location / {
            # Forward the request to the upstream group defined above
            proxy_pass http://app_servers;

            # Pass essential HTTP headers so Flask knows the real client details
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP 1.1 support for persistent keepalive connections
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}