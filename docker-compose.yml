services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: devops_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: secretpassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d devops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # BLUE ENVIRONMENT (Active production)
  web-blue:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres_user:secretpassword123@db:5432/devops_db
      APP_VERSION: "1.0.0-blue"
      ENVIRONMENT: "production-blue"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"

  # GREEN ENVIRONMENT (Idle / New release target)
  web-green:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres_user:secretpassword123@db:5432/devops_db
      APP_VERSION: "2.0.0-green"
      ENVIRONMENT: "production-green"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-blue
      - web-green

volumes:
  postgres_data: