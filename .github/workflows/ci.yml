name: Continuous Integration & Delivery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================================
  # JOB 1: Test & Lint (Runs on all pushes and pull requests)
  # ==========================================================
  test-and-lint:
    name: Run Linting & Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone repo into runner VM
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python runtime
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      # Step 4: Run Flake8 Static Analysis
      - name: Lint with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv

      # Step 5: Execute Pytest Suite
      - name: Run Pytest
        run: |
          python -m pytest

  # ==========================================================
  # JOB 2: Build & Push Docker Image (Runs only after Job 1 passes on main)
  # ==========================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (Layer Caching & Multi-platform builder)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate with Docker Hub using encrypted secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build and Push with Dual-Tagging (Git SHA + latest)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/zero-downtime-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/zero-downtime-app:latest